name: whats_app_status_saver
description: WS Saver.

publish_to: 'none' 
version: 1.0.0+2
environment:
  sdk: '>=2.18.2 <4.0.0'

isar_version: &isar_version 3.1.0+1

dependencies:
  flutter:
    sdk: flutter

  # cupertino_icons: 1.0.2
  
  path_provider: 2.0.14
  permission_handler: 11.3.1
  # image_gallery_saver: 1.7.1
  
  video_player: 2.8.6 
  chewie: 1.8.1
  # provider: 6.0.5
  share_plus: 9.0.0
  flutter_bloc: 8.1.5
  get_it: 7.7.0
  equatable: 2.0.5
  device_info_plus: 10.1.0
  # file_picker: 5.2.6
  shared_preferences: 2.2.3
  video_thumbnail: 0.5.3
  gallery_saver: 2.3.2
  # image_picker: 1.0.2
  flutter_native_splash: 2.4.0
  swipe_to: 1.0.6
  isar: *isar_version
  isar_flutter_libs: *isar_version

dev_dependencies:
  flutter_test:
    sdk: flutter

  rename: 3.0.2
  flutter_lints: 4.0.0
  dependency_validator: 4.1.0
  isar_generator: *isar_version
  build_runner: 2.4.8

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    # ws_permission_img.png
  
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        
    # - family: OpenSans
    #   fonts:
    #     - asset: assets/fonts/OpenSans-Regular.ttf
  
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
