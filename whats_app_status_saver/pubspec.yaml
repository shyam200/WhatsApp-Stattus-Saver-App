name: whats_app_status_saver
description: WS Saver.

publish_to: 'none' 
version: 1.0.0+1
environment:
  sdk: '>=2.18.2 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  
  path_provider: ^2.0.14
  permission_handler: ^10.2.0
  image_gallery_saver: ^1.7.1
  
  video_player: ^2.6.0 
  chewie: ^1.4.0
  provider: ^6.0.5
  share_plus: ^6.3.4
  flutter_bloc: ^8.1.2
  get_it: ^7.2.0
  equatable: ^2.0.5
  device_info_plus: ^8.1.0
  file_picker: ^5.2.6
  shared_preferences: ^2.1.0
  video_thumbnail: ^0.5.3
  gallery_saver: ^2.3.2
  image_picker: ^1.0.2
  flutter_native_splash: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true
  
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
  
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
